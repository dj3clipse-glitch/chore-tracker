<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Household Chore Tracker</title>

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chore Tracker">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Lock Screen -->
  <div id="pin-screen" class="pin-container">
    <h2>Enter Passcode</h2>
    <input type="password" id="pin-input" placeholder="4-digit PIN" maxlength="4">
    <button onclick="checkPin()">Unlock</button>
    <p id="pin-error" class="error-msg"></p>
  </div>

  <!-- App Main View -->
  <div id="app-container" class="app-container hidden">
    <header>
      <h1>Chore Tracker</h1>
      <button onclick="lockApp()" class="lock-btn">🔒 Lock</button>
    </header>

    <!-- Search & Sort Controls -->
    <div class="controls-section">
      <input type="text" id="search-input" placeholder="Search chores..." oninput="filterAndSortChores()">
      
      <select id="sort-select" onchange="filterAndSortChores()">
        <option value="name-asc">Sort: A-Z</option>
        <option value="name-desc">Sort: Z-A</option>
        <option value="status">Sort: Incomplete First</option>
      </select>
    </div>

    <!-- Input Section -->
    <div class="input-section">
      <input type="text" id="chore-input" placeholder="Add a new chore...">
      <button onclick="addChore()">Add</button>
    </div>

    <!-- List Output -->
    <ul id="chore-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
