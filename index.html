<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Household Chore Tracker</title>

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chore Tracker">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Access Control Passcode Screen -->
  <div id="pin-screen" class="card pin-card">
    <h2>Enter Passcode</h2>
    <input type="password" id="pin-input" placeholder="4-digit PIN" maxlength="4">
    <button type="button" class="btn-green" onclick="checkPin()">Unlock</button>
    <p id="pin-error" class="error-msg"></p>
  </div>

  <!-- Main Application Area -->
  <div id="app-container" class="dashboard-wrapper hidden">
    
    <!-- Title Sidebar / Header -->
    <div class="brand-side">
      <h1>Household<br>Chore<br>Tracker</h1>
      <button onclick="lockApp()" class="lock-btn">🔒 Lock App</button>
    </div>

    <!-- Search & Sort Controls Bar -->
    <div class="top-controls card">
      <input type="text" id="search-input" placeholder="Search logs..." oninput="filterAndSortChores()">
      <select id="sort-select" onchange="filterAndSortChores()">
        <option value="latest">Sort: Newest First</option>
        <option value="oldest">Sort: Oldest First</option>
        <option value="person-asc">Sort: Person (A-Z)</option>
        <option value="chore-asc">Sort: Chore (A-Z)</option>
      </select>
    </div>

    <div class="content-grid">
      <!-- Left Card: Form -->
      <div class="card form-card">
        <h2>Log a Completed Chore</h2>
        
        <form id="chore-form">
          <label for="person">Who completed it?</label>
          <input type="text" id="person" placeholder="E.g., Alex, Mom, Sam" required>

          <label for="chore">What chore was done?</label>
          <input type="text" id="chore" placeholder="E.g., Washed Dishes, Took out trash" required>

          <button type="submit" class="btn-green">Log Chore</button>
        </form>
      </div>

      <!-- Right Card: History Table -->
      <div class="card table-card">
        <h2>Chore Log History</h2>
        
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Person</th>
                <th>Chore</th>
                <th>Date & Time</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="chore-table-body">
              <!-- Dynamically populated via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
